[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "api-fastapi-microservice"
version = "0.1.0"
description = "FastAPI microservice template"
authors = ["Mohammadreza Farkhondeh mohammr.farkhonde12@sharif.edu"]
readme = "README.md"
package-mode = false

[tool.poetry.scripts]
dev = "uvicorn:main"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.117.0"
uvicorn = {extras = ["standard"], version = "^0.36.0"}
pydantic = "^2.11.0"
pydantic-settings = "^2.10.0"
structlog = "^25.4.0"
prometheus-client = "^0.23.0"
psutil = "7.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.2.0"
httpx = "^0.28.1"
ruff = "^0.13.1"
mypy = "^1.18.2"
types-psutil = "^7.0.0.20250822"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "ARG", "SIM"]
ignore = ["W191"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
